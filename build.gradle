plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '0.1.2'
group = 'com.mathioks.narutomod'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') { args '--nogui' }
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', 'am', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.12')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// O teste do motor de combos é um main() de console, não JUnit.
tasks.named('test') { enabled = false }

tasks.register('comboTest', JavaExec) {
    group = 'verification'
    description = 'Roda o teste de console do motor de combos C/V/B'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mathioks.narutomod.ComboEngineTest'
}
